<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>簡沛琪 & 陳頌祺 · 20.12.2026</title>
<meta property="og:type" content="website"/>
<meta property="og:title" content="簡沛琪 & 陳頌祺 · 20.12.2026"/>
<meta property="og:description" content="輕觸打開午宴請柬"/>
<meta property="og:image" content="https://christine-ki-invite-songbill.vercel.app/cover.jpg"/>
<meta property="og:image:alt" content="Christine and Ki"/>
<meta name="twitter:card" content="summary_large_image"/>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+TC:wght@400;600&family=Jost:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#3a4a5c;--mute:#6d7f93;--gold:#8d6e32}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d9e4f0;font-family:"Noto Serif TC",serif;color:var(--ink)}
body{display:flex;justify-content:center}
.stage{width:100%;max-width:430px;height:100dvh;min-height:100dvh;position:relative;overflow:hidden;background:linear-gradient(180deg,#efe8f4,#d7e4f2)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;width:100%;border:0;padding:0;margin:0;background:transparent;color:inherit;font:inherit;appearance:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:0;cursor:pointer;transition:transform 1.15s cubic-bezier(.22,.7,.2,1),opacity .7s}
.env{width:88%;position:relative;filter:drop-shadow(0 16px 26px rgba(70,90,120,.22))}
.env img{width:100%;display:block;border-radius:10px}
.seal-glow{position:absolute;left:50%;top:46%;width:108px;height:108px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(232,196,110,.72) 0%,rgba(196,163,90,.28) 38%,transparent 70%);animation:breathe 2.6s ease-in-out infinite}
.seal-glow.flash{animation:seal-flash .7s ease-out forwards}
.hint{position:absolute;left:50%;top:62%;transform:translate(-50%,0);width:80%;margin:0;text-align:center;white-space:nowrap;letter-spacing:.12em;font-size:12px;color:#7a6230;text-shadow:0 1px 0 rgba(255,255,255,.85);pointer-events:none;z-index:2;animation:hint-pulse 2.6s ease-in-out infinite}
.letter{position:absolute;inset:0;z-index:3;background:#f3f6fb;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(108%);opacity:0;pointer-events:none;transition:transform 1.2s .05s,opacity .55s .15s}
.inner{padding:22px 16px 80px;text-align:center}
.kicker{font-family:Jost,sans-serif;letter-spacing:.26em;font-size:10px;color:var(--gold);text-transform:uppercase}
h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:40px;line-height:1.15;color:#6a86a8;margin:6px 0 4px}
.cn{font-size:15px;color:#5d7390;margin-bottom:10px}
.full{width:100%;border-radius:10px;display:block;margin:10px 0 16px}
.poem{font-size:14px;line-height:1.95;color:var(--mute)}
.rule{width:46px;height:1px;background:#c4a35a;margin:18px auto}
.block{margin:22px 0}
.label{font-family:Jost,sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.time{font-size:18px;margin:3px 0}
.note{font-size:14px;color:var(--mute);line-height:1.85}
.btns{display:grid;gap:10px;margin-top:14px}
a.btn{display:block;text-decoration:none;border:1px solid #c4a35a;color:#7a6230;padding:13px 14px;font-family:Jost,sans-serif;font-size:11px;letter-spacing:.14em;background:rgba(255,255,255,.55)}
a.solid{background:#8aa7c4;border-color:#8aa7c4;color:#fff}
footer{margin-top:8px;font-size:13px;color:var(--mute);line-height:1.9}
.opened .wrap{transform:translateY(-118%);opacity:0;pointer-events:none}
.opened .letter{transform:none;opacity:1;pointer-events:auto}
.opened .hint,.opened .seal-glow{animation:none}
.cd{display:flex;justify-content:center;gap:16px;margin:12px 0}
.cd-num{font-size:26px;color:#5d7390}
.cd-label{font-family:Jost,sans-serif;font-size:9px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.side-tag{display:none;margin:0 auto 10px;font-family:Jost,sans-serif;font-size:11px;letter-spacing:.16em;color:#7a6230;border:1px solid #c4a35a;padding:6px 12px;background:rgba(255,255,255,.55)}
.music{position:absolute;top:14px;right:14px;z-index:8;width:42px;height:42px;border:1px solid #c4a35a;border-radius:50%;background:rgba(255,255,255,.75);color:#7a6230;font-size:16px;cursor:pointer}
.music.on::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(196,163,90,.28);border-top-color:#c4a35a;animation:spin 3.4s linear infinite;pointer-events:none}
.petals,.burst{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.petals{z-index:4}
.opened .petals{z-index:6;opacity:.38}
.petal{position:absolute;top:-40px;left:var(--left);animation:fall var(--dur) linear var(--delay) infinite;will-change:transform}
.burst{z-index:7}
.flake{position:absolute;margin:-12px 0 0 -12px;animation:burst-out 1.35s cubic-bezier(.16,.7,.3,1) forwards}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.92);opacity:.45}50%{transform:translate(-50%,-50%) scale(1.08);opacity:.95}}
@keyframes hint-pulse{0%,100%{opacity:.62}50%{opacity:1}}
@keyframes seal-flash{0%{transform:translate(-50%,-50%) scale(1);opacity:1}45%{transform:translate(-50%,-50%) scale(1.85);opacity:.95}100%{transform:translate(-50%,-50%) scale(2.3);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translate3d(0,-8vh,0) rotate(0);opacity:0}12%{opacity:.78}100%{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot));opacity:.2}}
@keyframes burst-out{0%{transform:translate(0,0) scale(.35) rotate(0);opacity:0}18%{opacity:.92}100%{transform:translate(var(--bx),var(--by)) scale(1) rotate(var(--br));opacity:0}}
@media (prefers-reduced-motion:reduce){
  .petal,.flake,.seal-glow,.hint,.music.on::before{animation:none!important}
  .seal-glow{opacity:.7}
  .spark,.spark.on{opacity:1!important;animation:none!important;filter:none!important;text-shadow:none!important}
}
.spark.on{animation:ink-in 4.6s cubic-bezier(.16,.55,.24,1) both;animation-delay:var(--d,0ms)}
@keyframes ink-in{
  0%{opacity:0;filter:blur(9px);text-shadow:0 0 0 rgba(255,244,220,0),0 0 0 rgba(214,190,230,0)}
  28%{opacity:.16;filter:blur(6px);text-shadow:0 0 20px rgba(255,246,224,.9),0 0 40px rgba(214,190,230,.7)}
  62%{opacity:.55;filter:blur(2.4px);text-shadow:0 0 16px rgba(236,214,176,.78),0 0 30px rgba(206,184,226,.5)}
  100%{opacity:1;filter:blur(0);text-shadow:0 0 10px rgba(226,204,164,0)}
}
.motes{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.motes i{position:absolute;width:7px;height:7px;border-radius:50%;opacity:0;filter:blur(.4px);animation:mote 5.4s ease-in-out forwards}
@keyframes mote{
  0%{opacity:0;transform:translateY(14px) scale(.3)}
  30%{opacity:.55}
  100%{opacity:0;transform:translateY(-70px) scale(1.15)}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="petals" id="petals" aria-hidden="true"></div>
  <div class="burst" id="burst" aria-hidden="true"></div>
  <button class="music" id="musicBtn" type="button" aria-label="music">♪</button>
  <button class="wrap" id="openBtn" type="button">
    <span class="env">
      <img src="/envelope.jpg" alt="請柬信封"/>
      <span class="seal-glow" id="seal"></span>
      <p class="hint">輕觸金印，打開請柬</p>
    </span>
  </button>
  <article class="letter">
    <div class="inner">
      <p class="side-tag" id="sideTag"></p>
      <p class="kicker">The Wedding of</p>
      <h1>Christine & Ki</h1>
      <p class="cn">簡沛琪　&　陳頌祺</p>
      <img class="full" src="/cover.jpg" alt="Christine and Ki"/>
      <div class="cd">
        <div><div class="cd-num" id="d">—</div><div class="cd-label">Days</div></div>
        <div><div class="cd-num" id="h">—</div><div class="cd-label">Hrs</div></div>
        <div><div class="cd-num" id="m">—</div><div class="cd-label">Min</div></div>
      </div>
      <p class="poem">繡球盛放的冬日<br/>我們想把祝福凑成一束<br/>邀請你來共享這場午宴</p>
      <div class="rule"></div>
      <img class="full" src="/details.jpg" alt="婚禮詳情"/>
      <div class="block">
        <p class="label">Luncheon</p>
        <p class="time">入席 上午十一時三十分</p>
        <p class="time">開席 中午十二時正</p>
        <p class="time">千禧新世界香港酒店</p>
        <p class="note">主席廳（M樓）· 中式宴會<br/>九龍尖沙咀東部麼地道72號</p>
        <div class="btns"><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=New+World+Millennium+Hong+Kong+Hotel,+72+Mody+Road,+Tsim+Sha+Tsui,+Hong+Kong" target="_blank" rel="noopener">開啟地圖導航</a></div>
      </div>
      <div class="block">
        <p class="label">Kindly Reply</p>
        <p class="note">懇請於 <strong>2026 年 11 月 20 日</strong> 前回覆<br/>撰揭即開 WhatsApp，填姓名、人數、會否提早觀禮</p>
        <div class="btns">
          <a class="btn solid" id="btnGroom" href="https://wa.me/85268099966?text=%E4%BD%A0%E5%A5%BD%EF%BC%8C%E6%88%91%E6%83%B3%E5%9B%9E%E8%A6%86%E7%B0%A1%E6%B2%9B%E7%90%AA%EF%BC%86%E9%99%B3%E9%A0%8C%E7%A5%BA%E5%A9%9A%E7%A6%AE%E5%87%BA%E5%B8%AD%EF%BC%88%E7%94%B7%E6%96%B9%E8%A6%AA%E5%8F%8B%EF%BC%89%0A%0A%E5%A7%93%E5%90%8D%EF%BC%9A%0A%E5%87%BA%E5%B8%AD%E4%BA%BA%E6%95%B8%EF%BC%9A%0A%E6%9C%83%E5%90%A6%E6%8F%90%E6%97%A9%E5%88%B0%E5%A0%B4%E8%A7%80%E7%A6%AE%EF%BC%9A%EF%BC%88%E6%9C%83%EF%BC%8F%E5%90%A6%EF%BC%89" target="_blank" rel="noopener">男方親友回覆</a>
          <a class="btn solid" id="btnBride" href="https://wa.me/85265066418?text=%E4%BD%A0%E5%A5%BD%EF%BC%8C%E6%88%91%E6%83%B3%E5%9B%9E%E8%A6%86%E7%B0%A1%E6%B2%9B%E7%90%AA%EF%BC%86%E9%99%B3%E9%A0%8C%E7%A5%BA%E5%A9%9A%E7%A6%AE%E5%87%BA%E5%B8%AD%EF%BC%88%E5%A5%B3%E6%96%B9%E8%A6%AA%E5%8F%8B%EF%BC%89%0A%0A%E5%A7%93%E5%90%8D%EF%BC%9A%0A%E5%87%BA%E5%B8%AD%E4%BA%BA%E6%95%B8%EF%BC%9A%0A%E6%9C%83%E5%90%A6%E6%8F%90%E6%97%A9%E5%88%B0%E5%A0%B4%E8%A7%80%E7%A6%AE%EF%BC%9A%EF%BC%88%E6%9C%83%EF%BC%8F%E5%90%A6%EF%BC%89" target="_blank" rel="noopener">女方親友回覆</a>
          <a class="btn" href="data:text/calendar;charset=utf-8,BEGIN:VCALENDAR%0AVERSION:2.0%0ABEGIN:VEVENT%0ASUMMARY:Christine %26 Ki Wedding%0ADTSTART:20261220T113000%0ADTEND:20261220T160000%0ALOCATION:%E5%8D%83%E7%A6%A7%E6%96%B0%E4%B8%96%E7%95%8C%E9%A6%99%E6%B8%AF%E9%85%92%E5%BA%97%20%E4%B8%BB%E5%B8%AD%E5%BB%B3%EF%BC%88M%E6%A8%93%EF%BC%89%EF%BC%8C%E5%B0%96%E6%B2%99%E5%92%80%E6%9D%B1%E9%83%A8%E9%BA%BC%E5%9C%B0%E9%81%9372%E8%99%9F%0AEND:VEVENT%0AEND:VCALENDAR">加入行事曆</a>
        </div>
      </div>
      <img class="full" src="/cats-back.jpg" alt="Thank you"/>
      <footer>感謝你願意來<br/>With love, 簡沛琪 & 陳頌祺</footer>
    </div>
  </article>
</div>
<audio id="bgm" src="/Westlife_-_Beautiful_In_White_(mp3.pm).mp3" loop preload="auto"></audio>
<script>
var AMBIENT = [
  {left:"6%",delay:"0s",dur:"19s",size:22,color:"#8eafd4",dx:"26px",rot:"210deg"},
  {left:"22%",delay:"-6s",dur:"22s",size:16,color:"#e3b7c9",dx:"-18px",rot:"-160deg"},
  {left:"41%",delay:"-11s",dur:"17s",size:20,color:"#c5b3dc",dx:"14px",rot:"180deg"},
  {left:"58%",delay:"-3s",dur:"21s",size:15,color:"#efc6d4",dx:"-28px",rot:"-200deg"},
  {left:"74%",delay:"-14s",dur:"18s",size:24,color:"#9bb8d8",dx:"22px",rot:"240deg"},
  {left:"88%",delay:"-8s",dur:"23s",size:14,color:"#d7c4e4",dx:"-12px",rot:"-140deg"},
  {left:"33%",delay:"-17s",dur:"20s",size:18,color:"#a9c3b4",dx:"30px",rot:"190deg"}
];
function floret(color, size){
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 40 40" aria-hidden="true"><g fill="'+color+'"><ellipse cx="20" cy="9" rx="5.2" ry="7.4"/><ellipse cx="20" cy="9" rx="5.2" ry="7.4" transform="rotate(72 20 20)"/><ellipse cx="20" cy="9" rx="5.2" ry="7.4" transform="rotate(144 20 20)"/><ellipse cx="20" cy="9" rx="5.2" ry="7.4" transform="rotate(216 20 20)"/><ellipse cx="20" cy="9" rx="5.2" ry="7.4" transform="rotate(288 20 20)"/></g><circle cx="20" cy="20" r="2.6" fill="#f7f1e6"/></svg>';
}
var petals = document.getElementById("petals");
AMBIENT.forEach(function(p){
  var s = document.createElement("span");
  s.className = "petal";
  s.style.setProperty("--left", p.left);
  s.style.setProperty("--delay", p.delay);
  s.style.setProperty("--dur", p.dur);
  s.style.setProperty("--dx", p.dx);
  s.style.setProperty("--rot", p.rot);
  s.innerHTML = floret(p.color, p.size);
  petals.appendChild(s);
});
var path = (location.pathname || "").replace(/\/+$/, "");
var q = new URLSearchParams(location.search).get("side");
var side = q || (path.indexOf("groom") >= 0 ? "groom" : path.indexOf("bride") >= 0 ? "bride" : "");
var tag = document.getElementById("sideTag");
if (side === "groom") {
  document.getElementById("btnBride").style.display = "none";
  tag.style.display = "inline-block";
  tag.textContent = "男方親友請柬";
} else if (side === "bride") {
  document.getElementById("btnGroom").style.display = "none";
  tag.style.display = "inline-block";
  tag.textContent = "女方親友請柬";
}
var audio = document.getElementById("bgm");
var TARGET = 0.03;
var playing = false;
var fadeTimer = null;
var holdTimer = null;
var musicBtn = document.getElementById("musicBtn");
var opened = false;
audio.volume = 0;
function setIcon(){
  musicBtn.textContent = playing ? "\u266a" : "\u2715";
  musicBtn.classList.toggle("on", playing);
}
function stopFade(){
  if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
}
function fadeTo(target, ms, done){
  if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
  var start = audio.volume;
  var t0 = Date.now();
  fadeTimer = setInterval(function(){
    var p = Math.min(1, (Date.now() - t0) / ms);
    audio.volume = Math.max(0, Math.min(1, start + (target - start) * p));
    if (p >= 1) {
      clearInterval(fadeTimer);
      fadeTimer = null;
      if (done) done();
    }
  }, 40);
}
function playMusic(){
  stopFade();
  audio.volume = 0;
  audio.play().then(function(){
    playing = true;
    setIcon();
    holdTimer = setTimeout(function(){ fadeTo(TARGET, 7000); }, 1800);
  }).catch(function(){ playing = false; setIcon(); });
}
function pauseMusic(){
  stopFade();
  fadeTo(0, 700, function(){ audio.pause(); playing = false; setIcon(); });
}
musicBtn.addEventListener("click", function(e){
  e.stopPropagation();
  if (playing) pauseMusic(); else playMusic();
});
function burst(){
  var stage = document.getElementById("stage").getBoundingClientRect();
  var seal = document.getElementById("seal").getBoundingClientRect();
  var x = seal.left + seal.width / 2 - stage.left;
  var y = seal.top + seal.height / 2 - stage.top;
  var colors = ["#8eafd4","#e3b7c9","#c5b3dc","#efc6d4","#9bb8d8","#d7c4e4"];
  var box = document.getElementById("burst");
  for (var i = 0; i < 10; i++) {
    var angle = (Math.PI * 2 * i) / 10 + (Math.random() - 0.5) * 0.4;
    var dist = 70 + Math.random() * 90;
    var flake = document.createElement("span");
    flake.className = "flake";
    flake.style.left = x + "px";
    flake.style.top = y + "px";
    flake.style.setProperty("--bx", (Math.cos(angle) * dist) + "px");
    flake.style.setProperty("--by", (Math.sin(angle) * dist - 20) + "px");
    flake.style.setProperty("--br", ((Math.random() - 0.5) * 160) + "deg");
    flake.innerHTML = floret(colors[i % colors.length], 14 + (i % 3) * 4);
    box.appendChild(flake);
  }
}
var MAGIC = new URLSearchParams(location.search).get("magic") === "1" && !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function splitInk(el){
  if (!el || el.dataset.ink) return;
  el.dataset.ink = "1";
  var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node){
      if (!node.nodeValue) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(node){
    var frag = document.createDocumentFragment();
    var text = node.nodeValue;
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === "\n") { frag.appendChild(document.createTextNode(ch)); continue; }
      var s = document.createElement("span");
      s.className = "spark";
      s.textContent = ch === " " ? "\u00a0" : ch;
      frag.appendChild(s);
    }
    node.parentNode.replaceChild(frag, node);
  });
}
function playInk(el, start){
  splitInk(el);
  var sparks = el.querySelectorAll(".spark");
  var delay = start || 0;
  sparks.forEach(function(s){
    s.style.setProperty("--d", delay + "ms");
    s.classList.add("on");
    if (s.textContent && s.textContent !== "\u00a0") delay += 140;
  });
  return delay;
}
function motes(){
  var box = document.createElement("div");
  box.className = "motes";
  box.setAttribute("aria-hidden", "true");
  var colors = ["#e7d39a", "#fff8e6", "#d7c4e4", "#c4a35a", "#f3e7c2"];
  for (var i = 0; i < 22; i++) {
    var dot = document.createElement("i");
    dot.style.left = (6 + Math.random() * 88) + "%";
    dot.style.top = (6 + Math.random() * 62) + "%";
    dot.style.animationDelay = (Math.random() * 1.8) + "s";
    dot.style.background = colors[i % colors.length];
    box.appendChild(dot);
  }
  document.querySelector(".letter").appendChild(box);
}
function settleInk(){
  document.querySelectorAll(".spark").forEach(function(s){
    s.style.opacity = "1";
    s.style.animation = "none";
    s.style.textShadow = "none";
  });
}
if (MAGIC) playInk(document.querySelector(".hint"), 400);
document.getElementById("openBtn").addEventListener("click", function(){
  if (opened) return;
  opened = true;
  burst();
  document.getElementById("seal").classList.add("flash");
  document.getElementById("stage").classList.add("opened");
  playMusic();
  if (!MAGIC) return;
  motes();
  setTimeout(function(){
    var cursor = 80;
    var nodes = document.querySelectorAll(".letter .side-tag, .letter .kicker, .letter h1, .letter .cn, .letter .cd-num, .letter .cd-label, .letter .poem, .letter .label, .letter .time, .letter .note, .letter footer");
    nodes.forEach(function(el){
      if (el.id === "sideTag" && el.style.display !== "inline-block") return;
      if (el.tagName === "H1") {
        el.style.animation = "ink-in 5.2s cubic-bezier(.16,.55,.24,1) both";
        el.style.animationDelay = cursor + "ms";
        cursor += 1600;
        return;
      }
      cursor = playInk(el, cursor) + 380;
    });
  }, 420);
  setTimeout(settleInk, 42000);
});
var t = new Date("2026-12-20T12:00:00+08:00").getTime();
function tick(){
  var s = Math.max(0, Math.floor((t - Date.now()) / 1000));
  document.getElementById("d").textContent = Math.floor(s / 86400);
  document.getElementById("h").textContent = Math.floor((s % 86400) / 3600);
  document.getElementById("m").textContent = Math.floor((s % 3600) / 60);
}
tick();
setInterval(tick, 30000);
</script>
</body>
</html>
