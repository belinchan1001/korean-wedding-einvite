<title>簡沛琪 &amp; 陳頌祺 · 20.12.2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Great+Vibes&family=Noto+Serif+TC:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#d9e4f0;--paper:#f3f6fb;--ink:#3a4a5c;--mute:#6d7f93;--gold:#c4a35a;--gold-deep:#8d6e32}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC",serif}
body{display:flex;justify-content:center}
.stage{width:100%;max-width:430px;min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#efe8f4 0%,#d7e4f2 100%)}
.hint{position:absolute;left:0;right:0;bottom:24px;z-index:6;text-align:center;font-family:Jost,sans-serif;letter-spacing:.18em;font-size:13px;color:#5d6f82;transition:opacity .5s}
.envelope-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;transition:transform 1.15s cubic-bezier(.22,.7,.2,1),opacity .7s}
.envelope{width:88%;position:relative;cursor:pointer;filter:drop-shadow(0 16px 26px rgba(70,90,120,.22))}
.envelope img{width:100%;display:block;border-radius:10px}
.letter{position:absolute;inset:0;z-index:3;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(108%);opacity:0;transition:transform 1.2s cubic-bezier(.22,.7,.2,1) .05s,opacity .55s .15s}
.inner{padding:22px 16px 80px;text-align:center}
.kicker{font-family:Jost,sans-serif;letter-spacing:.26em;font-size:10px;color:var(--gold-deep);text-transform:uppercase}
h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:40px;color:#6a86a8;margin:6px 0 4px}
.cn{font-size:15px;color:#5d7390;margin-bottom:10px}
.full{width:100%;border-radius:10px;display:block;margin:10px 0 16px;box-shadow:0 8px 18px rgba(80,100,130,.12)}
.poem{font-size:14px;line-height:1.95;color:var(--mute)}
.rule{width:46px;height:1px;background:var(--gold);margin:18px auto}
.block{margin:22px 0}
.label{font-family:Jost,sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:6px}
.time{font-size:18px;margin:3px 0}
.note{font-size:14px;color:var(--mute);line-height:1.85}
.btns{display:grid;gap:10px;margin-top:14px}
a.btn{display:block;text-decoration:none;border:1px solid var(--gold);color:#7a6230;padding:13px 14px;font-family:Jost,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.55)}
a.btn.solid{background:#8aa7c4;border-color:#8aa7c4;color:#fff}
footer{margin-top:8px;font-size:13px;color:var(--mute);line-height:1.9}
.opened .envelope-wrap{transform:translateY(-118%);opacity:0;pointer-events:none}
.opened .letter{transform:none;opacity:1}
.opened .hint{opacity:0}
.cd{display:flex;justify-content:center;gap:16px;margin:12px 0}
.cd-num{font-family:"Cormorant Garamond",serif;font-size:26px;color:#5d7390}
.cd-label{font-family:Jost,sans-serif;font-size:9px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
</style>
</head>
